<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chat para superheroes</title>

    <meta name="description" content="Chat para superhéroes con GPS, cámara y video. PWA instalable con modo offline.">

    <!-- Conexiones tempranas a los orígenes externos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <!-- CSS crítico (mismo origen): lo único que bloquea el render -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="js/libs/plugins/mdtoast.min.css">

    <!-- CSS externo NO crítico: se carga sin bloquear el render -->
    <link href="https://fonts.googleapis.com/css?family=Quicksand:300,400|Lato:300,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.css" media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css?family=Quicksand:300,400|Lato:300,400&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.css">
    </noscript>

    <link rel="shortcut icon" type="image/ico" href="img/favicon.ico"/>

    <link rel="manifest" href="manifest.json">

    <!-- Android -->
    <meta name="theme-color" content="#2b78b0">

    <!-- IOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">


    <link rel="apple-touch-icon" href="img/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="img/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="167x167" href="img/icons/icon-152x152.png">

    <!-- iPhone X (1125px x 2436px) -->
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="img/icons-ios/apple-launch-1125x2436.png">
    <!-- iPhone 8, 7, 6s, 6 (750px x 1334px) -->
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="img/icons-ios/apple-launch-750x1334.png">
    <!-- iPhone 8 Plus, 7 Plus, 6s Plus, 6 Plus (1242px x 2208px) -->
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" href="img/icons-ios/apple-launch-1242x2208.png">
    <!-- iPhone 5 (640px x 1136px) -->
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" href="img/icons-ios/apple-launch-640x1136.png">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="apple-mobile-web-app-title" content="Twittor!">

    <!-- Actividad 7: estilos del banner de instalación -->
    <style>
        /* Fuera del flujo del documento (position: fixed) => no empuja el contenido ni causa CLS */
        #install-banner { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 1000; margin: 0; padding: 12px; text-align: center; background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
        #install-banner span { display: block; margin-bottom: 8px; color: #555; }
        #install-banner #install-btn { background-color: #2b78b0; width: 70%; padding: 8px; }
        #install-banner #install-cerrar { background-color: #5f6b6c; width: auto; padding: 8px 12px; margin-left: 6px; }
    </style>

</head>
<body>
        <!-- Titulo -->
        <span class="first"> 
            <span id="salir-btn" class="fa fa-sign-out-alt out oculto animated fadeIn" role="button" tabindex="0" aria-label="Salir"></span>
            <span id="titulo">
                <i class="fa fa-user"></i>
                Seleccione Personaje
            </span>
            <span id="nuevo-btn" class="fa fa-pen-square new oculto animated fadeIn fast" role="button" tabindex="0" aria-label="Nuevo mensaje"></span>
        </span>
        <!-- Fin Titulo -->

        <!-- Modal -->
        <div id="modal" class="oculto">
            <img id="modal-avatar" src="img/avatars/spiderman.webp" alt="" width="50" height="50">

            <span class="first"> 
                <span id="titulo-modal">Nuevo mensaje</span>
                <span id="cancel-btn" class="fa fa-times" role="button" tabindex="0" aria-label="Cerrar"></span>
            </span>
            

            <div class="nuevo-mensaje">
                <textarea id="txtMensaje" aria-label="Escribe tu mensaje" placeholder="Nuevo mensaje..." rows="5"></textarea>

                <!-- <div class="modal-mapa oculto">
                    <iframe
                        width="100%"
                        height="250"
                        frameborder="0"
                        src="https://www.google.com/maps/embed/v1/view?key=AIzaSyA-HXVa2jtkGfKtIJwisxgC46RaWqC1xuI&center=14.027334, -87.220878&zoom=17" allowfullscreen>
                        </iframe>
                </div > -->
                <div class="camara-contenedor fadeIn fast oculto" align="center">
                    
                    <video id="player" autoplay style="height: 300px;"></video>

                    <button id="tomar-foto-btn">
                        <i class="fa fa-camera"></i>
                        Tomar Foto
                    </button>
                </div>

                <!-- Actividad 7: grabación de video (webm) -->
                <div class="video-contenedor fadeIn fast oculto" align="center">

                    <!-- Vista previa en vivo mientras se graba -->
                    <video id="player-video" autoplay muted playsinline style="height: 240px;"></video>

                    <!-- Reproducción de la grabación terminada -->
                    <video id="revision-video" class="oculto" controls playsinline style="height: 240px;"></video>

                    <div id="video-estado" class="video-estado"></div>

                    <button id="grabar-video-btn">
                        <i class="fa fa-circle"></i>
                        Grabar
                    </button>
                    <button id="detener-video-btn" class="oculto">
                        <i class="fa fa-stop"></i>
                        Detener
                    </button>
                    <button id="regrabar-video-btn" class="oculto">
                        <i class="fa fa-redo"></i>
                        Volver a grabar
                    </button>
                </div>

            </div>

            
            <!-- boton de enviar -->

            <div id="post-btn" role="button" tabindex="0" aria-label="Enviar mensaje" class="fab">
                <i class="fa fa-paper-plane"></i>
            </div>

            <div id="location-btn" role="button" tabindex="0" aria-label="Agregar ubicación" class="fab-marker">
                <i class="fa fa-map-marker-alt"></i>
            </div>

            <div id="photo-btn" role="button" tabindex="0" aria-label="Tomar foto" class="fab-photo">
                <i class="fa fa-camera"></i>
            </div>

            <!-- Actividad 3: seguimiento continuo de la ubicación -->
            <div id="track-btn" role="button" tabindex="0" aria-label="Seguir mi ubicación" class="fab-track" title="Seguir mi ubicación">
                <i class="fa fa-location-arrow"></i>
            </div>

            <!-- Actividad 7: grabar video -->
            <div id="video-btn" role="button" tabindex="0" aria-label="Grabar video" class="fab-video" title="Grabar video">
                <i class="fa fa-video"></i>
            </div>

        </div>
        <!-- Fin Modal -->


        <!-- Seleccion de personaje -->
        <main>
        <div id="seleccion" class="seleccion" align="center">

            <!-- Actividad 7: banner de instalación personalizada -->
            <div id="install-banner" class="oculto">
                <span>¿Quieres usar el chat como app?</span>
                <button id="install-btn">Instalar la aplicación en su dispositivo</button>
                <button id="install-cerrar" aria-label="Cerrar">✕</button>
            </div>
        
            <!-- Botón de notificaciones -->
            <!-- Espacio reservado: el botón aparece aquí sin mover el resto (evita CLS) -->
            <div class="noti-slot">
                <button class="oculto btn-noti-activadas">Notificaciones Activadas</button>
                <button class="oculto btn-noti-desactivadas">Notificaciones Desactivadas</button>
            </div>
            <!-- Fin de boton de notificaciones -->

            <div>
                <img data-user="spiderman" src="img/avatars/spiderman.webp" alt="spiderman" class="seleccion-avatar" width="150" height="150" fetchpriority="high">
            </div>

            <div>
                <img data-user="ironman" src="img/avatars/ironman.webp" alt="ironman" class="seleccion-avatar" width="150" height="150">
            </div>

            <div>
                <img data-user="wolverine" src="img/avatars/wolverine.webp" alt="wolverine" class="seleccion-avatar" width="150" height="150">
            </div>

            <div>
                <img data-user="thor" src="img/avatars/thor.webp" alt="thor" class="seleccion-avatar" width="150" height="150">
            </div>

            <div>
                <img data-user="hulk" src="img/avatars/hulk.webp" alt="hulk" class="seleccion-avatar" width="150" height="150">
            </div>

        </div>

        <!-- FIN Seleccion de personaje -->

        <!-- Lista de mensajes -->
        <ul id="timeline" class="timeline oculto">
            
            <!-- Mensaje -->
            <!-- <li class="animated fadeIn fast">
                <div class="avatar">
                    <img src="img/avatars/spiderman.webp" alt="" width="250" height="250">
                </div>
                <div class="bubble-container">
                    <div class="bubble">
                        <h3>@spiderman</h3>
                        <br/>
                        La tía May, hizo unos panqueques en forma de ironman!
                    </div>
                    
                    <div class="arrow"></div>
                </div>
            </li> -->
            <!-- Fin del mensaje -->

            <!-- Mapa message -->
            <!-- <li class="animated fadeIn fast">
                <div class="avatar">
                    <img src="img/avatars/spiderman.webp" alt="" width="250" height="250">
                </div>
                <div class="bubble-container">
                    <div class="bubble">
                        <iframe
                            width="100%"
                            height="250"
                            frameborder="0" style="border:0"
                            src="https://www.google.com/maps/embed/v1/view?key=AIzaSyA-HXVa2jtkGfKtIJwisxgC46RaWqC1xuI&center=14.027334, -87.220878&zoom=17" allowfullscreen>
                            </iframe>
                    </div>
                    
                    <div class="arrow"></div>
                </div>
            </li>  -->
            <!-- Fin del mensaje -->

        </ul>
        <!-- Fin Lista de mensajes -->
        </main>


      
    
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
        <script defer src="js/libs/plugins/mdtoast.min.js"></script>
        
        <!-- Actividad 6: monitoreo RUM (web-vitals) -->
        <script defer src="https://cdn.jsdelivr.net/npm/web-vitals@5/dist/web-vitals.iife.js"></script>
        <script defer src="js/vitals.js"></script>
        <!-- Actividad 7: instalación personalizada -->
        <script defer src="js/install.js"></script>

        <!-- Camara Class -->
        <script defer src="js/camara-class.js"></script>
        <!-- Geolocalización (act. 1-6) y grabación de video (act. 7) -->
        <script defer src="js/geo-class.js"></script>
        <script defer src="js/video-class.js"></script>
        <script defer src="js/app.js"></script>
    
</body>
</html>
